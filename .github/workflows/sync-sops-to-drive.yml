name: Sync SOPs to Google Drive

on:
  push:
    branches: [main]
    paths:
      - "sops/**/*.md"
      - "sops/*.md"
      - "sop-mapping.json"
      - "sync/**"
      - ".github/workflows/sync-sops-to-drive.yml"
  workflow_dispatch:
    inputs:
      sync_all:
        description: "Sync every SOP in the mapping (ignore changed-files detection)"
        required: false
        default: "false"

concurrency:
  group: sync-sops-to-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install dependencies
        run: pip install -r sync/requirements.txt

      - name: Determine changed SOPs
        id: changed
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v45
        with:
          files: |
            sops/**/*.md
            sops/*.md

      - name: Sync changed SOPs
        if: github.event_name == 'push' && steps.changed.outputs.any_changed == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python sync/sync_sops.py \
            --mapping sop-mapping.json \
            ${{ steps.changed.outputs.all_changed_files }}

      - name: Sync all SOPs (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.sync_all == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sync/sync_sops.py --mapping sop-mapping.json --all

      - name: No-op summary
        if: github.event_name == 'push' && steps.changed.outputs.any_changed != 'true'
        run: echo "No SOP markdown files changed in this push. Skipping."
